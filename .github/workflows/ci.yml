name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the checks be started by hand, which is the way out when a run gets
  # stuck and can neither be cancelled nor restarted.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan the repository
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: neuron
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d neuron"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres-websocket:
        image: ghcr.io/neondatabase/wsproxy:latest
        env:
          ALLOW_ADDR_REGEX: '^postgres:5432$'
        ports:
          - 5433:80
        options: >-
          --health-cmd "curl --fail http://localhost:2112/metrics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Test migration safety against a behind schema
        run: node node_modules/vitest/vitest.mjs run --config apps/api/vitest.release.config.ts
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@postgres:5432/neuron
          DATABASE_URL: postgresql://neuron_app:runtimeapp123@postgres:5432/neuron
          DATABASE_URL_AUTH: postgresql://neuron_auth:runtimeauth123@postgres:5432/neuron
          DATABASE_URL_TEST_WS_PROXY: localhost:5433/v1

      - name: Verify Preview build is owner-free
        run: pnpm --filter @neuron/api db:verify-vercel
        env:
          VERCEL_ENV: preview

      - name: Check migrations
        run: pnpm db:check
        env:
          DATABASE_URL_OWNER: postgresql://postgres:postgres@localhost:5432/neuron

      - name: Build
        run: pnpm build

  browser-selection:
    name: Select browser coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.select.outputs.full }}
      files: ${{ steps.select.outputs.files }}
      visual: ${{ steps.select.outputs.visual }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Select browser coverage
        id: select
        env:
          BROWSER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BROWSER_FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node --test scripts/select-browser-tests.test.mjs scripts/browser-gate.test.mjs
          node scripts/select-browser-tests.mjs

  phone-interaction:
    name: Phone interactions
    needs: browser-selection
    uses: ./.github/workflows/browser-interaction.yml
    with:
      project: phone-interaction
      full: ${{ needs.browser-selection.outputs.full == 'true' }}
      files: ${{ needs.browser-selection.outputs.files }}

  desktop-interaction:
    name: Desktop interactions
    needs: browser-selection
    uses: ./.github/workflows/browser-interaction.yml
    with:
      project: desktop-interaction
      full: ${{ needs.browser-selection.outputs.full == 'true' }}
      files: ${{ needs.browser-selection.outputs.files }}

  browser:
    name: Browser and screenshot tests
    # Stable required check; each selected suite must finish successfully.
    needs: [browser-selection, phone-interaction, desktop-interaction, visual]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Require all selected browser suites
        env:
          BROWSER_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/browser-gate.mjs

  visual:
    name: Windows visual contracts
    needs: browser-selection
    # Start independently of both interaction runners and retain failure diagnostics.
    if: ${{ needs.browser-selection.outputs.visual == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@neuron/web..." build
      - run: pnpm --filter @neuron/web test:screens:install
      - name: Compare visual contracts
        env:
          VISUAL_SNAPSHOT_SUITE: 'true'
        run: pnpm --filter @neuron/web test:screens --project=phone --project=desktop
      - name: Keep visual diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-visual-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
