name: Production migrations

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  production-schema:
    name: Production migration journal
    runs-on: ubuntu-latest
    environment: production-migrations

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify and apply production migrations
        run: pnpm --filter @neuron/api db:ensure-production-migrations
        env:
          DATABASE_URL_OWNER: ${{ secrets.DATABASE_URL_OWNER }}
