name: Browser interaction runner

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      full:
        required: true
        type: boolean
      files:
        required: true
        type: string

permissions:
  contents: read

jobs:
  interaction:
    name: ${{ inputs.project }} ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    # The whole required CI budget is five minutes. A shard is balanced to about
    # three minutes of tests; anything near this limit needs another shard or a
    # faster test, never a longer timeout.
    timeout-minutes: 8
    strategy:
      # Every shard reports, so one failure does not hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build browser app
        run: pnpm --filter "@neuron/web..." build
      - name: Choose this shard's files
        id: shard
        env:
          BROWSER_PROJECT: ${{ inputs.project }}
          BROWSER_FULL: ${{ inputs.full }}
          BROWSER_FILES: ${{ inputs.files }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: 6
        run: node scripts/shard-browser-tests.mjs
      - name: Install Chromium
        if: ${{ steps.shard.outputs.files != '' }}
        run: pnpm --filter @neuron/web exec playwright install --with-deps chromium
      - name: Run interaction browser tests
        if: ${{ steps.shard.outputs.files != '' }}
        shell: bash
        env:
          BROWSER_PROJECT: ${{ inputs.project }}
          SHARD_FILES: ${{ steps.shard.outputs.files }}
        run: |
          read -r -a files <<< "$SHARD_FILES"
          pnpm --filter @neuron/web test:screens "${files[@]}" --project="$BROWSER_PROJECT" --workers=1
      - name: Keep the browser report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-${{ inputs.project }}-${{ matrix.shard }}-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
