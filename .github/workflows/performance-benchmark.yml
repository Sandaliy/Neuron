name: Performance benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    name: Controlled active swipe comparisons
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@neuron/web..." build
      - run: pnpm --filter @neuron/web exec playwright install --with-deps chromium
      - name: Original full trace measurement
        continue-on-error: true
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-swipe-traced
        run: pnpm --filter @neuron/web test:screens tests/interaction-lifecycle.spec.ts --project=phone-interaction --workers=1 --repeat-each=3
      - name: Identical application without recording
        continue-on-error: true
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-swipe-untraced
        run: pnpm --filter @neuron/web test:screens tests/interaction-lifecycle.spec.ts --project=phone-interaction --workers=1 --repeat-each=3 --trace=off
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: controlled-swipe-comparisons
          path: |
            apps/web/playwright-swipe-traced/
            apps/web/playwright-swipe-untraced/
            apps/web/test-results/
          retention-days: 14
