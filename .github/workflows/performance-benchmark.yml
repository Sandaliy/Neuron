name: Performance benchmark

on:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/app/shell.tsx'
      - 'apps/web/src/features/notes/**'
      - 'apps/web/src/preferences/frame-rate.ts'
      - 'apps/web/src/router.tsx'
      - 'apps/web/src/styles/**'
      - 'apps/web/src/ui/**'
      - 'apps/web/tests/00-note-list-performance.spec.ts'
      - 'apps/web/tests/performance.spec.ts'
      - 'apps/web/playwright.config.ts'
      - 'apps/web/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fps:
    name: 5,000-note frame-rate monitor
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build browser app
        run: pnpm --filter "@neuron/web..." build

      - name: Install Chromium
        run: pnpm --filter @neuron/web test:screens:install

      - name: Measure collection frame rates
        env:
          PERFORMANCE_BENCHMARK: 'true'
        run: pnpm --filter @neuron/web test:screens tests/00-note-list-performance.spec.ts tests/performance.spec.ts --project=phone-performance --workers=1

      - name: Keep benchmark diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: frame-rate-benchmark
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
