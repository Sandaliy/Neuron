name: Performance benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fps:
    name: 5,000-note frame-rate monitor
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build browser app
        run: pnpm --filter "@neuron/web..." build

      - name: Install Chromium
        run: pnpm --filter @neuron/web test:screens:install

      - name: Measure collection frame rates
        env:
          PERFORMANCE_BENCHMARK: 'true'
        run: pnpm --filter @neuron/web test:screens tests/00-note-list-performance.spec.ts tests/performance.spec.ts --project=phone-performance --workers=1

      - name: Keep benchmark diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v5
        with:
          name: frame-rate-benchmark
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
