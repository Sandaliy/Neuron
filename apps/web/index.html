<!doctype html>
<html lang="en" data-theme="dark" data-glass="full" data-gscope="floating">
  <head>
    <meta charset="utf-8" />
    <!--
      interactive-widget=resizes-content makes the on-screen keyboard shrink the
      layout viewport rather than being drawn over it, so a sheet anchored to the
      bottom edge is anchored above the keyboard. Browsers that ignore it are
      handled by src/lib/viewport.ts, which measures the difference instead.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Neuron</title>
    <meta
      name="description"
      content="Spaced repetition that schedules your time, not your card count"
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#08090b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)" />

    <!--
      The theme, the glass and the movement, before anything paints.

      This runs synchronously in the head, ahead of the stylesheet and well
      ahead of React, so the first frame the browser draws is already the right
      colour. Doing it in a React effect instead means one frame of dark behind
      a light theme on every single load, which reads as a broken app.

      It is duplicated logic, and deliberately so: src/theme/theme.ts holds the
      same three lines for the app to use once it is running. Both are covered
      by the same test, so they cannot drift apart silently.

      The glass level is here for the same reason. It changes what every
      floating layer is made of, and reading it a frame late means the first
      frame of a phone that turned the effect off still carries the blur.
    -->
    <script>
      // Content-free lifecycle breadcrumbs survive a failed launch and recovery.
      (function () {
        var key = 'neuron.lifecycle';
        var stages = [
          'shell',
          'module',
          'restore-start',
          'restore-ready',
          'restore-failed',
          'account-start',
          'account-ready',
          'account-deadline',
          'connection-check-start',
          'connection-check-end',
          'connection-silence',
          'connection-server-error',
          'connection-unreachable',
          'connection-recheck',
          'offline',
          'foreground',
          'focus',
          'visible',
          'hidden',
          'pageshow',
          'pageshow-cached',
          'offline-event',
          'gate-ready',
          'read-start',
          'read-ready',
          'worker-ready',
          'script-error',
        ];
        var start = Date.now();
        var records = [];
        try {
          var previous = JSON.parse(localStorage.getItem(key) || '[]');
          if (Array.isArray(previous))
            records = previous
              .filter(function (row) {
                return (
                  row &&
                  stages.indexOf(row.stage) >= 0 &&
                  Number.isFinite(row.at) &&
                  Number.isFinite(row.elapsed) &&
                  typeof row.online === 'boolean'
                );
              })
              .slice(-80)
              .map(function (row) {
                return { stage: row.stage, at: row.at, elapsed: row.elapsed, online: row.online };
              });
        } catch (_) {}
        var current = [];
        window.neuronLifecycleReport = function () {
          return JSON.stringify(records.concat(current));
        };
        window.neuronLifecycle = function (stage) {
          if (stages.indexOf(stage) < 0) return;
          current.push({
            stage: stage,
            at: start,
            elapsed: Date.now() - start,
            online: navigator.onLine,
          });
          // Pin startup and failure stages through repeated foreground events.
          // Preceding launches stay intact throughout this recovery.
          if (current.length > 40) {
            var failures = current.filter(function (row) {
              return (
                [
                  'restore-failed',
                  'account-deadline',
                  'connection-silence',
                  'connection-server-error',
                  'connection-unreachable',
                  'script-error',
                ].indexOf(row.stage) >= 0
              );
            });
            current = current.slice(0, 8).concat(failures.slice(-8), current.slice(-24));
            current = current.filter(function (row, index) {
              return current.indexOf(row) === index;
            });
          }
          try {
            localStorage.setItem(key, window.neuronLifecycleReport());
          } catch (_) {}
        };
        window.neuronLifecycle('shell');
        window.addEventListener(
          'error',
          function () {
            window.neuronLifecycle('script-error');
          },
          true,
        );
        window.addEventListener('unhandledrejection', function () {
          window.neuronLifecycle('script-error');
        });
      })();
      (function () {
        try {
          var stored = localStorage.getItem('neuron.theme');
          var choice =
            stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var dark =
            choice === 'dark' ||
            (choice === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;

          root.dataset.theme = dark ? 'dark' : 'light';
          root.style.colorScheme = dark ? 'dark' : 'light';

          var locale = localStorage.getItem('neuron.locale');

          if (locale === 'en' || locale === 'ru') {
            root.lang = locale;
          }

          var glass = localStorage.getItem('neuron.glass');

          if (glass !== 'off' && glass !== 'subtle' && glass !== 'full') {
            glass = 'full';
          }

          // The same ceiling the app applies, in the two cases that can be
          // read this early: a system asking for less movement, and a device
          // that admits to little memory.
          if (
            window.matchMedia('(prefers-reduced-motion: reduce)').matches ||
            (typeof navigator.deviceMemory === 'number' && navigator.deviceMemory <= 4)
          ) {
            glass = glass === 'full' ? 'subtle' : glass;
          }

          root.dataset.glass = glass;
          root.dataset.glassChoice = localStorage.getItem('neuron.glass') || 'full';

          var scope = localStorage.getItem('neuron.glass-scope');

          root.dataset.gscope = scope === 'all' ? 'all' : 'floating';

          if (localStorage.getItem('neuron.motion') === 'reduce') {
            root.dataset.motion = 'reduce';
          }
        } catch (error) {
          // A browser with storage blocked still gets the default theme from
          // the attribute on the html element. Nothing here is worth failing
          // the page load over.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
